<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quản lý đơn hàng</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f4f4f4; }
    form { margin-top: 20px; }
    input, button { margin: 5px; padding: 6px; }
  </style>
</head>
<body>
  <h1>Quản lý đơn hàng</h1>

  <div>
    <label>JWT Token:</label>
    <input type="text" id="token" placeholder="Dán JWT token" style="width:60%">
    <button onclick="saveToken()">Lưu token</button>
  </div>

  <h2>Danh sách đơn hàng</h2>
  <table id="orders-table">
    <thead>
      <tr>
        <th>ID</th><th>Khách hàng</th><th>Email</th><th>Tổng tiền</th><th>Trạng thái</th><th>Hành động</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>Tạo đơn hàng</h2>
  <form id="create-order-form">
    <input type="text" id="customer_name" placeholder="Tên khách hàng" required>
    <input type="email" id="customer_email" placeholder="Email khách hàng" required>
    <div id="items-container"></div>
    <button type="button" onclick="addItemRow()">+ Thêm mặt hàng</button>
    <button type="submit">Tạo đơn</button>
  </form>

  <h2>Chi tiết đơn hàng</h2>
  <div id="order-detail" style="display:none">
    <div>
      <strong>Đơn hàng #<span id="detail-order-id"></span></strong> - Tổng: <span id="detail-total"></span> - Trạng thái: 
      <select id="detail-status">
        <option value="pending">pending</option>
        <option value="completed">completed</option>
        <option value="cancelled">cancelled</option>
      </select>
      <button onclick="updateOrderStatus()">Cập nhật trạng thái</button>
      <button onclick="deleteOrder()" style="margin-left:10px;color:#b00">Xóa đơn</button>
    </div>
    <table id="order-items-table">
      <thead>
        <tr>
          <th>ID</th><th>Product ID</th><th>Tên</th><th>Số lượng</th><th>Đơn giá</th><th>Thành tiền</th><th>Hành động</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <h3>Thêm mặt hàng vào đơn</h3>
    <div>
      <input type="number" id="add-product-id" placeholder="product_id">
      <input type="number" id="add-quantity" placeholder="quantity">
      <button onclick="addItemToOrder()">Thêm</button>
    </div>
  </div>

  <script>
    const API_BASE = location.origin; // http://localhost:5002

    function getToken(){ return localStorage.getItem('ORDER_JWT') || ''; }
    function authHeaders(){ return { "Authorization": "Bearer " + getToken() }; }
    function saveToken(){ localStorage.setItem('ORDER_JWT', document.getElementById('token').value); loadOrders(); }
    document.getElementById('token').value = getToken();

    async function loadOrders(){
      const res = await fetch(`${API_BASE}/orders`, { headers: authHeaders() });
      const data = await res.json();
      const tbody = document.querySelector('#orders-table tbody');
      tbody.innerHTML = '';
      (data || []).forEach(o => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${o.id}</td>
          <td>${o.customer_name}</td>
          <td>${o.customer_email}</td>
          <td>${o.total_amount.toFixed ? o.total_amount.toFixed(2) : o.total_amount}</td>
          <td>${o.status}</td>
          <td>
            <button onclick="viewOrder(${o.id})">Xem</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function addItemRow(){
      const c = document.getElementById('items-container');
      const row = document.createElement('div');
      row.innerHTML = `
        <input type="number" placeholder="product_id" class="item-product"> 
        <input type="number" placeholder="quantity" class="item-qty">
        <button type="button" onclick="this.parentElement.remove()">Xóa</button>
      `;
      c.appendChild(row);
    }

    async function createOrder(e){
      e.preventDefault();
      const items = [];
      document.querySelectorAll('#items-container .item-product').forEach((el, idx) => {
        const qty = document.querySelectorAll('#items-container .item-qty')[idx].value;
        if(el.value && qty){ items.push({ product_id: Number(el.value), quantity: Number(qty) }); }
      });
      const body = {
        customer_name: document.getElementById('customer_name').value,
        customer_email: document.getElementById('customer_email').value,
        items
      };
      await fetch(`${API_BASE}/orders`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify(body)
      });
      e.target.reset();
      document.getElementById('items-container').innerHTML = '';
      loadOrders();
    }

    async function viewOrder(id){
      const res = await fetch(`${API_BASE}/orders/${id}`, { headers: authHeaders() });
      const o = await res.json();
      const detail = document.getElementById('order-detail');
      detail.style.display = 'block';
      document.getElementById('detail-order-id').textContent = o.id;
      document.getElementById('detail-total').textContent = (o.total_amount.toFixed ? o.total_amount.toFixed(2) : o.total_amount);
      document.getElementById('detail-status').value = o.status;

      const tbody = document.querySelector('#order-items-table tbody');
      tbody.innerHTML = '';
      (o.items || []).forEach(it => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${it.id}</td>
          <td>${it.product_id}</td>
          <td>${it.product_name}</td>
          <td><input type="number" value="${it.quantity}" data-item="${it.id}"></td>
          <td>${it.unit_price}</td>
          <td>${it.total_price}</td>
          <td>
            <button onclick="updateItem(${it.id})">Cập nhật</button>
            <button onclick="deleteItem(${it.id})" style="color:#b00">Xóa</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function updateOrderStatus(){
      const id = document.getElementById('detail-order-id').textContent;
      const status = document.getElementById('detail-status').value;
      await fetch(`${API_BASE}/orders/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ status })
      });
      viewOrder(id); loadOrders();
    }

    async function deleteOrder(){
      const id = document.getElementById('detail-order-id').textContent;
      await fetch(`${API_BASE}/orders/${id}`, { method: 'DELETE', headers: authHeaders() });
      document.getElementById('order-detail').style.display = 'none';
      loadOrders();
    }

    async function addItemToOrder(){
      const order_id = Number(document.getElementById('detail-order-id').textContent);
      const product_id = Number(document.getElementById('add-product-id').value);
      const quantity = Number(document.getElementById('add-quantity').value);
      await fetch(`${API_BASE}/order_items`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ order_id, product_id, quantity })
      });
      document.getElementById('add-product-id').value = '';
      document.getElementById('add-quantity').value = '';
      viewOrder(order_id); loadOrders();
    }

    async function updateItem(itemId){
      const input = document.querySelector(`[data-item="${itemId}"]`);
      const quantity = Number(input.value);
      await fetch(`${API_BASE}/order_items/${itemId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ quantity })
      });
      const id = document.getElementById('detail-order-id').textContent; viewOrder(id); loadOrders();
    }

    async function deleteItem(itemId){
      await fetch(`${API_BASE}/order_items/${itemId}`, { method: 'DELETE', headers: authHeaders() });
      const id = document.getElementById('detail-order-id').textContent; viewOrder(id); loadOrders();
    }

    document.getElementById('create-order-form').addEventListener('submit', createOrder);
    loadOrders();
  </script>
</body>
</html>
