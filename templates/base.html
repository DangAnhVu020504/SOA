<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dịch vụ Báo cáo{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>📊 Dịch vụ Báo cáo</h1>
            </div>
            <div class="nav-menu">
                <a href="{{ url_for('index') }}" class="nav-link">Trang chủ</a>
                <a href="{{ url_for('order_reports_page') }}" class="nav-link">Báo cáo Đơn hàng</a>
                <a href="{{ url_for('product_reports_page') }}" class="nav-link">Báo cáo Sản phẩm</a>
                <span id="user-info" class="nav-link" style="display: none;"></span>
                <button id="logout-btn" class="btn btn-secondary" style="display: none;" onclick="logout()">Đăng xuất</button>
                <button id="login-btn" class="btn btn-primary" onclick="showLogin()">Đăng nhập</button>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Dịch vụ Báo cáo - Bài thực hành số 5</p>
        </div>
    </footer>

    <!-- Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeLogin()">&times;</span>
            <h2>Đăng nhập</h2>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Tên đăng nhập:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="authServiceUrl">URL Authentication Service:</label>
                    <input type="text" id="authServiceUrl" name="authServiceUrl" value="http://localhost:5002" placeholder="http://localhost:5002">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Đăng nhập</button>
            </form>
            <div id="loginError" class="error-message" style="display: none;"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
